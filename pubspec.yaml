name: repediu_events
description: Repediu events SDK for Flutter apps. Tracks screens, cart, orders, campaigns and customer identity, with an offline queue and multi-store support.
version: 0.1.1
repository: https://github.com/plug4sales/repediu-events-flutter-sdk
issue_tracker: https://github.com/plug4sales/repediu-events-flutter-sdk/issues
topics:
  - analytics
  - ecommerce
  - tracking

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  http: ">=0.13.0 <2.0.0"
  meta: ">=1.9.0 <2.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"
  shared_preferences_platform_interface: ">=2.3.0 <3.0.0"
